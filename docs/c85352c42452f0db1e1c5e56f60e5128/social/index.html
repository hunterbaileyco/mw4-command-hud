<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0E0C">
<link rel="apple-touch-icon" href="../icon.svg">
<title>Kinsora social — published metrics</title>
<style>
:root{--bg:#0B0E0C;--panel:#121612;--line:#2A3328;--tan:#C5A572;--olive:#6B7C3A;--amber:#E8A317;--holdink:#E07A5F;--ink:#E8E2D6;--dim:#8a8676;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,rgba(107,124,58,.10),transparent 60%),var(--bg)}
a{color:inherit;text-decoration:none}button{font:inherit}
.wrap{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-family:var(--mono);color:var(--tan);font-size:11px;text-align:center;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.brand .sl{color:var(--olive)}
.back{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--tan);border:1px solid #3a4636;padding:4px 8px;border-radius:2px}
.asof{font-family:var(--mono);color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--olive);box-shadow:0 0 6px var(--olive)}
.dot.stale{background:var(--holdink);box-shadow:0 0 6px var(--holdink)}
h1{margin:2px 0 0;font-size:17px;font-weight:650;letter-spacing:.01em}
.sub{color:var(--dim);font-size:12px}
.pn{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
.pn .brk{position:absolute;width:12px;height:12px;border-color:var(--tan);border-style:solid;opacity:.6;pointer-events:none}
.brk.tl{top:-1px;left:-1px;border-width:2px 0 0 2px}.brk.br{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.zh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.zh b{color:var(--tan)}.zh b::before{content:"▌";color:var(--olive);margin-right:5px}
.all{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.all{grid-template-columns:repeat(4,1fr)}}
.tile{appearance:none;text-align:left;background:#0d110e;border:1px solid var(--line);border-radius:4px;padding:8px;color:var(--ink);cursor:pointer}
.tile.on{border-color:var(--amber);box-shadow:0 0 0 1px rgba(232,163,23,.5),0 0 14px rgba(232,163,23,.15)}
.tile .l{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.tile .n{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;margin:2px 0}
.tile .d{font-size:11px;color:var(--dim)}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#0d110e}
.seg button{flex:1;appearance:none;background:transparent;border:0;border-right:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:8px 4px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--olive);color:#0B0E0C;font-weight:700}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media(min-width:560px){.kv{grid-template-columns:repeat(3,1fr)}}
.kv>div{border:1px solid var(--line);border-radius:3px;padding:6px 8px;background:#0d110e}
.kv .l{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.kv .v{font-family:var(--mono);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.kv .v.a{color:var(--amber)}.kv .v.t{color:var(--tan)}
.kv .wide{grid-column:1/-1}.kv .wide .v{font-family:var(--sans);font-size:13px;font-weight:500}
.cap{color:var(--dim);font-size:11.5px;margin:6px 0 0}
.chart{width:100%;height:170px;display:block;margin-top:8px}
.chart text{font-family:var(--mono);font-size:9px;fill:var(--dim)}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.post{display:block;border:1px solid var(--line);border-left:3px solid var(--olive);border-radius:3px;padding:7px 8px;background:#0d110e}
.post.x{border-left-color:var(--holdink)}
.post .h{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim)}
.post .h .src{color:var(--tan)}.post.x .h .src{color:var(--holdink)}
.post .hk{margin:3px 0 4px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post .m{display:flex;gap:12px;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink);flex-wrap:wrap}
.post .m b{color:var(--amber)}
.post .m span i{font-style:normal;color:var(--dim);font-size:9px;letter-spacing:.1em;margin-right:3px}
.sort{display:flex;gap:6px;align-items:center}
.sort select{background:#0d110e;color:var(--tan);border:1px solid #3a4636;border-radius:2px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:3px 4px}
.more{appearance:none;width:100%;margin-top:6px;background:transparent;border:1px solid #3a4636;color:var(--tan);font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:8px;border-radius:2px;cursor:pointer}
details{font-size:12px;color:var(--dim)}details summary{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--tan);cursor:pointer}
details li{margin:4px 0}
.warn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--holdink);text-transform:uppercase}
.foot{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim);text-align:center;text-transform:uppercase}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;background:var(--bg)}
#gate form{width:min(340px,100%);display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
#gate .brand{font-size:14px;text-align:center}
#gate .cls{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);text-align:center;text-transform:uppercase}
#gate label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--tan);text-transform:uppercase}
#gate input{width:100%;margin-top:6px;background:#0B0E0C;border:1px solid var(--line);border-radius:2px;color:var(--ink);padding:12px;font-family:var(--mono);font-size:16px;letter-spacing:.2em;text-align:center;outline:none}
#gate input:focus{border-color:var(--olive);box-shadow:0 0 0 1px var(--olive)}
#gate button{background:var(--olive);color:#0B0E0C;border:0;border-radius:2px;padding:12px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.2em;cursor:pointer}
#gate .err{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--holdink);min-height:16px;text-align:center}
#app{display:none}
</style>
</head>
<body>
<div id="gate"><form id="gf" autocomplete="off">
  <div class="brand">MW4 <span class="sl">//</span> SOCIAL</div>
  <div class="cls">Task Force Kinsora · Jae lane · feed encrypted</div>
  <label for="pw">Auth code<input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" autofocus></label>
  <button type="submit">▶ UNLOCK</button>
  <div class="err" id="gerr"></div>
  <a class="foot" href="../hub/">◂ Back to hub</a>
</form></div>

<div id="app"><div class="wrap">
  <div class="top">
    <a class="back" href="../hub/">◂ HUB</a>
    <div class="brand">MW4 <span class="sl">//</span> SOCIAL <span class="sl">·</span> JAE</div>
    <div class="asof"><span class="dot" id="dot"></span><span id="asof">—</span></div>
  </div>
  <div><h1>Kinsora social — published metrics</h1><div class="sub" id="sub"></div></div>
  <div class="warn" id="stale"></div>

  <section class="pn"><span class="brk tl"></span><span class="brk br"></span>
    <div class="zh"><b>All channels</b><span>tap to switch</span></div>
    <div class="all" id="all"></div>
  </section>

  <section class="pn"><span class="brk tl"></span><span class="brk br"></span>
    <div class="zh"><b id="chname">Channel</b><span id="chplat"></span></div>
    <div class="seg" id="range">
      <button data-r="all" class="on">Since 1st post</button><button data-r="30">30 days</button><button data-r="7">7 days</button>
    </div>
    <div class="kv" id="kv" style="margin-top:8px"></div>
  </section>

  <section class="pn"><span class="brk tl"></span><span class="brk br"></span>
    <div class="zh"><b id="charttitle">Trend</b><span id="chartsrc"></span></div>
    <div class="seg" id="mode"></div>
    <svg class="chart" id="chart" viewBox="0 0 600 170" preserveAspectRatio="none"></svg>
    <p class="cap" id="chartcap"></p>
  </section>

  <section class="pn"><span class="brk tl"></span><span class="brk br"></span>
    <div class="zh"><b id="tbltitle">Every published post</b>
      <span class="sort">SORT <select id="sort"><option value="new">Newest</option><option value="views">Top views</option><option value="likes">Top likes</option></select></span></div>
    <div class="rows" id="rows"></div>
    <button class="more" id="more" type="button">SHOW MORE</button>
    <p class="cap" id="tblcap"></p>
  </section>

  <section class="pn"><span class="brk tl"></span><span class="brk br"></span>
    <details><summary>Data notes &amp; gaps</summary><ul id="notes"></ul></details>
  </section>
  <div class="foot" id="foot"></div>
  <div class="foot"><a href="../">MW4 COMMAND HUD</a> · <a href="#" id="lock">LOCK</a></div>
</div></div>

<script>
(() => {
  'use strict';
  // Same encryption + session key as the MW4 HUD (one auth code opens both; unlocking either keeps this tab unlocked).
  const HASH = '0b488216b0f3fff7076b1a9af7ed5abb84e17176fde44fddba9138b0ab08fcc9';
  const KEY = 'mw4hud.unlock', KKEY = 'mw4hud.k';
  const STALE_MS = 36 * 3600 * 1000;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => /^https:\/\/(www\.)?(tiktok\.com|instagram\.com|pinterest\.com|pin\.it)\//.test(u || '') ? u : '';
  const te = new TextEncoder();
  const b64 = { enc: (u) => btoa(String.fromCharCode(...new Uint8Array(u))), dec: (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)) };
  const sha256 = async (t) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(t)))].map((x) => x.toString(16).padStart(2, '0')).join('');
  let aesKey = null, keyMeta = null;
  async function deriveFrom(code, env) {
    const km = await crypto.subtle.importKey('raw', te.encode(code), 'PBKDF2', false, ['deriveBits']);
    const raw = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64.dec(env.salt), iterations: env.iter }, km, 256);
    keyMeta = { salt: env.salt, iter: env.iter };
    aesKey = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    try { sessionStorage.setItem(KKEY, JSON.stringify({ ...keyMeta, k: b64.enc(raw) })); } catch (_) { /* private mode */ }
  }
  async function restoreKey() {
    try {
      const s = JSON.parse(sessionStorage.getItem(KKEY) || 'null'); if (!s) return false;
      aesKey = await crypto.subtle.importKey('raw', b64.dec(s.k), 'AES-GCM', false, ['decrypt']); keyMeta = { salt: s.salt, iter: s.iter }; return true;
    } catch (_) { return false; }
  }
  async function fetchEnv() {
    const r = await fetch('./metrics.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
  async function openEnv(env) {
    if (!aesKey) throw new Error('NO KEY');
    if (keyMeta && (keyMeta.salt !== env.salt || keyMeta.iter !== env.iter)) throw new Error('KEY ROTATED');
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(env.iv) }, aesKey, b64.dec(env.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function relock(msg) {
    sessionStorage.removeItem(KEY); sessionStorage.removeItem(KKEY); aesKey = null;
    $('app').style.display = 'none'; $('gate').style.display = ''; $('gerr').textContent = msg || '';
  }
  $('gf').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = $('pw').value; $('pw').value = '';
    const h = await sha256(code);
    if (h !== HASH) { $('gerr').textContent = '✕ ACCESS DENIED'; return; }
    $('gerr').textContent = 'DECRYPTING…';
    try { const env = await fetchEnv(); await deriveFrom(code, env); const d = await openEnv(env); sessionStorage.setItem(KEY, h); $('gerr').textContent = ''; start(d); }
    catch (err) { $('gerr').textContent = '✕ DECRYPT FAILED · ' + String(err.message || err).toUpperCase().slice(0, 40); }
  });
  $('lock').addEventListener('click', (e) => { e.preventDefault(); relock(); });
  if (sessionStorage.getItem(KEY) === HASH) restoreKey().then(async (ok) => {
    if (!ok) return relock();
    try { start(await openEnv(await fetchEnv())); } catch (err) { relock('RE-ENTER CODE'); }
  });

  // ---------- render ----------
  // post row: [ch, date, slot, hook, views, likes, comments, shares, saves, src(P|W|X), url]
  const fmt = (v) => (v == null ? '—' : Number(v).toLocaleString('en-US'));
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmtDay = (iso) => { const [, m, d] = iso.split('-').map(Number); return MON[m - 1] + ' ' + d; };
  const daysBefore = (iso, n) => new Date(new Date(iso + 'T12:00:00Z').getTime() - n * 86400000).toISOString().slice(0, 10);
  const sum = (rows, i) => rows.reduce((a, r) => a + (r[i] ?? 0), 0);
  let D = null, ch = 'tt_kco', range = 'all', mode = 'calendar', sort = 'new', limit = 25;

  function start(d) {
    D = d; $('gate').style.display = 'none'; $('app').style.display = 'block';
    if (!D.channels.some((c) => c.key === ch)) ch = D.channels[0].key;
    const gen = D.generatedAt || '';
    $('asof').textContent = 'PULLED ' + gen;
    $('sub').textContent = 'Every published post, back to each channel\u2019s first post. Snapshot ' + gen + '.';
    const asOfMs = new Date((D.asOfDay || '1970-01-01') + 'T23:59:59-07:00').getTime();
    const stale = Date.now() - asOfMs > STALE_MS;
    $('dot').classList.toggle('stale', stale);
    $('stale').textContent = stale ? '⚠ Snapshot from ' + gen + ' · posts after ' + fmtDay(D.asOfDay) + ' not included' : '';
    $('notes').innerHTML = [...D.notes, ...D.errors].map((n) => '<li>' + esc(n) + '</li>').join('');
    $('foot').textContent = 'Sources · ' + D.sources.join(' · ');
    render();
  }
  function render() {
    const C = D.channels, meta = C.find((c) => c.key === ch);
    const today = D.asOfDay;
    // all channel tiles
    $('all').innerHTML = C.map((c) => {
      const rs = D.posts.filter((r) => r[0] === c.key);
      const first = rs.reduce((a, r) => (r[1] < a ? r[1] : a), '9999');
      return `<button class="tile${c.key === ch ? ' on' : ''}" data-ch="${c.key}" type="button"><div class="l">${esc(c.label)}</div>
        <div class="n">${fmt(sum(rs, 4))}</div><div class="d">${esc(c.reach.toLowerCase())}${c.key === 'pin' ? ' (90d)' : ''} · ${rs.length} posts since ${first === '9999' ? '—' : fmtDay(first)}</div></button>`;
    }).join('');
    $('all').querySelectorAll('.tile').forEach((b) => b.onclick = () => { ch = b.dataset.ch; limit = 25; render(); });

    const all = D.posts.filter((r) => r[0] === ch);
    const firstPost = all.reduce((a, r) => (r[1] < a ? r[1] : a), '9999');
    const cutoff = range === 'all' ? firstPost : daysBefore(today, Number(range) - 1);
    const rows = all.filter((r) => r[1] >= cutoff);
    const withData = rows.filter((r) => r[4] != null);
    const top = [...withData].sort((a, b) => b[4] - a[4])[0];
    const pin = ch === 'pin';
    $('chname').textContent = meta.label;
    $('chplat').textContent = meta.platform + ' · ' + meta.handle;
    const rlabel = range === 'all' ? 'since first post' : 'last ' + range + ' days';
    $('kv').innerHTML = [
      ['Posts · ' + rlabel, `${rows.length}${meta.queue ? ` <span style="color:var(--dim);font-size:11px">+${meta.queue} queued</span>` : ''}`, 't'],
      [meta.reach + (pin ? ' (90d)' : ''), fmt(sum(rows, 4)), 'a'],
      [pin ? 'Reactions' : 'Likes', fmt(sum(rows, 5))],
      ['Comments', fmt(sum(rows, 6))],
      [pin ? 'Clicks (90d)' : 'Shares', fmt(sum(rows, 7))],
      ['Saves', fmt(sum(rows, 8))],
      ['Avg ' + meta.reach.toLowerCase() + '/post', withData.length ? fmt(Math.round(sum(withData, 4) / withData.length)) : '—'],
      ['Latest post (PT)', rows.length ? esc(rows[0][2]) : '—'],
      ['First post (PT)', esc(meta.firstPost || '—')],
    ].map(([l, v, c]) => `<div><div class="l">${l}</div><div class="v ${c || ''}">${v}</div></div>`).join('') +
      (top ? `<div class="wide"><div class="l">Top post · ${rlabel}</div><div class="v"><b style="color:var(--amber);font-family:var(--mono)">${fmt(top[4])}</b> · ${esc(top[3])}</div></div>` : '');

    // chart
    const ser = D.series[ch];
    const modes = [...(ser ? [['calendar', 'Daily (calendar)']] : []), ['posted', 'By day posted']];
    if (!modes.some((m) => m[0] === mode)) mode = modes[0][0];
    $('mode').innerHTML = modes.map(([v, l]) => `<button data-m="${v}" class="${v === mode ? 'on' : ''}" type="button">${l}</button>`).join('');
    $('mode').querySelectorAll('button').forEach((b) => b.onclick = () => { mode = b.dataset.m; render(); });
    let pts;
    if (mode === 'calendar') {
      pts = ser.points.filter(([d]) => d >= cutoff).map(([d, v]) => [d, v]);
      $('charttitle').textContent = 'Daily ' + meta.reach.toLowerCase();
      $('chartsrc').textContent = ser.source.split(' ').slice(0, 2).join(' ');
      $('chartcap').textContent = meta.calendarNote;
    } else {
      const m = new Map(); rows.filter((r) => r[4] != null).forEach((r) => m.set(r[1], (m.get(r[1]) || 0) + r[4]));
      pts = [...m.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1));
      $('charttitle').textContent = meta.reach + ' by day posted';
      $('chartsrc').textContent = 'per-post lifetime';
      $('chartcap').textContent = meta.postedNote;
    }
    drawChart(pts, mode === 'posted');

    // posts
    $('tbltitle').textContent = 'Every published post · ' + rows.length;
    const sorted = sort === 'new' ? rows : [...rows].sort((a, b) => ((sort === 'views' ? b[4] : b[5]) ?? -1) - ((sort === 'views' ? a[4] : a[5]) ?? -1));
    $('rows').innerHTML = sorted.slice(0, limit).map((r) => {
      const u = safeUrl(r[10]), tag = u ? 'a' : 'div';
      const src = r[9] === 'X' ? 'POSTIZ · NO ANALYTICS' : r[9] === 'P' ? 'POSTIZ' : 'WINDSOR';
      const m = pin
        ? [['IMPR', r[4], 1], ['REACT', r[5]], ['CMT', r[6]], ['CLK', r[7]], ['SAVE', r[8]]]
        : [['VIEWS', r[4], 1], ['LIKE', r[5]], ['CMT', r[6]], ['SHR', r[7]], ['SAVE', r[8]]];
      return `<${tag} class="post${r[9] === 'X' ? ' x' : ''}"${u ? ` href="${esc(u)}" target="_blank" rel="noopener noreferrer"` : ''}>
        <div class="h"><span>${esc(r[2])}</span><span class="src">${src}</span></div>
        <div class="hk">${esc(r[3] || '(no caption)')}</div>
        <div class="m">${m.map(([l, v, b]) => `<span><i>${l}</i>${b ? `<b>${fmt(v)}</b>` : fmt(v)}</span>`).join('')}</div></${tag}>`;
    }).join('') || '<div class="cap">No posts went up in this range.</div>';
    $('more').style.display = sorted.length > limit ? '' : 'none';
    $('more').textContent = `SHOW MORE (${sorted.length - Math.min(limit, sorted.length)} left)`;
    $('tblcap').textContent = pin
      ? 'Impressions, clicks and saves are 90-day totals from Windsor; reactions and comments are lifetime. Tap a post to open it.'
      : 'Postiz numbers where Postiz published the post, Windsor lifetime stats for everything else. A dash means no analytics. Tap a post to open it.';
  }
  function drawChart(pts, bars) {
    const svg = $('chart'), W = 600, H = 170, P = { l: 4, r: 4, t: 14, b: 18 };
    if (!pts.length) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">NO DATA IN THIS RANGE</text>`; return; }
    const mx = Math.max(1, ...pts.map((p) => p[1]));
    const x = (i) => P.l + (pts.length === 1 ? (W - P.l - P.r) / 2 : (i * (W - P.l - P.r)) / (pts.length - 1));
    const y = (v) => H - P.b - (v / mx) * (H - P.t - P.b);
    let g = '';
    for (let k = 1; k <= 3; k++) g += `<line x1="0" x2="${W}" y1="${y((mx * k) / 3)}" y2="${y((mx * k) / 3)}" stroke="rgba(107,124,58,.18)"/>`;
    g += `<text x="${W - 2}" y="${P.t - 3}" text-anchor="end">MAX ${fmt(mx)}</text>`;
    if (bars) {
      const bw = Math.max(2, ((W - P.l - P.r) / pts.length) * 0.7);
      g += pts.map((p, i) => `<rect x="${x(i) - bw / 2}" y="${y(p[1])}" width="${bw}" height="${H - P.b - y(p[1])}" fill="#E8A317" opacity=".85"><title>${fmtDay(p[0])}: ${fmt(p[1])}</title></rect>`).join('');
    } else {
      const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
      g += `<polygon points="${x(0)},${H - P.b} ${line} ${x(pts.length - 1)},${H - P.b}" fill="rgba(232,163,23,.10)"/>`;
      g += `<polyline points="${line}" fill="none" stroke="#E8A317" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
    }
    g += `<text x="2" y="${H - 4}">${fmtDay(pts[0][0])}</text><text x="${W - 2}" y="${H - 4}" text-anchor="end">${fmtDay(pts[pts.length - 1][0])}</text>`;
    const total = pts.reduce((a, p) => a + p[1], 0);
    g += `<text x="2" y="${P.t - 3}">TOTAL ${fmt(total)}</text>`;
    svg.innerHTML = g;
  }
  $('range').querySelectorAll('button').forEach((b) => b.onclick = () => { range = b.dataset.r; limit = 25; $('range').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); render(); });
  $('sort').onchange = (e) => { sort = e.target.value; render(); };
  $('more').onclick = () => { limit += 50; render(); };
})();
</script>
</body>
</html>
