<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0E0C">

<link rel="stylesheet" href="../glass.css">
<title>MW4 // CARE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 var(--sans)}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,rgba(107,124,58,.1),transparent 60%),var(--bg)}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:12px 10px 24px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.brand{font-family:var(--mono);font-size:20px;font-weight:800;letter-spacing:.16em;color:var(--tan)}
.brand .sl{color:var(--olive)}
.kick{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--olive2);text-transform:uppercase;margin-bottom:3px}
.panel{margin-top:12px;border:1px solid var(--line);border-radius:6px;padding:12px;background:rgba(18,22,18,.9)}
.panel h1{margin:8px 0;font-size:28px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.kpis div{border:1px solid var(--line);padding:8px}
.kpis b{display:block;font-family:var(--mono);font-size:18px}
.kpis span{font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--dim)}
.q{margin-top:10px}
.q div{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
</style>
</head>
<body class="sx-pad glass-ready">
<div id="glass"></div>
<div class="sx-band"><span class="cl">TOP SECRET // TF141</span><span class="mid">OP KINSORA · CARE</span><span class="clk" id="clk">—</span></div>
<div class="wrap">
  <div class="top">
    <div>
      <div class="kick">Laswell · care@kinsora.co</div>
      <div class="brand">MW4 <span class="sl">//</span> CARE</div>
    </div>
    <span data-hud-mode class="hud-mode-slot"></span>
  </div>
  <section class="panel" id="mw4care"><p>Checking the care feed…</p></section>
</div>
<div class="sx-dock"><nav>
  <a href="../hub/"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>HUB</a>
  <a href="../"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>HUD</a>
  <a href="../ledger/"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v3h3M9 11h6M9 15h4"/></svg>LEDGER</a>
  <a href="../orbat/"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v3.5M12 11H6.5V16.5M12 11h5.5V16.5"/></svg>ORBAT</a>
  <a href="../files/"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M8 13h8M8 17h5"/></svg>FILES</a>
</nav></div>
<script src="../hud-mode.js"></script>
<script src="../roster.js"></script>
<script src="../glass.js"></script>
<script src="../hub/care.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clk = () => { $('clk').textContent = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).format(new Date()) + ' PT'; };
  clk(); setInterval(clk, 1000);
  const opts = { base: '../', home: '../' };
  function paintMw4(d) {
    const C = window.MW4Care;
    const box = $('mw4care');
    if (!C || !C.liveModel(d)) {
      box.innerHTML = '<h1>Inbox</h1><p>The care feed is not live yet. Counts stay off until care@kinsora.co reports in.</p>';
      return;
    }
    const f = C.fragments(d);
    const k = d.kpis || {};
    box.innerHTML = '<div class="kick">LIVE · ' + esc(f.asOf) + '</div><h1>' + esc(C.dash(k.open)) + ' open</h1>' +
      '<div class="kpis">' + f.kpis + '</div><div class="q">' + (f.queue || '<p>The queue is empty.</p>') + '</div><p>' + f.footer + '</p>';
  }
  async function load(manual) {
    if (!manual && window.MW4Mode && !MW4Mode.refreshOn()) return;
    let d = null;
    let error = '';
    try {
      const r = await fetch('/api/feed?f=care&t=' + Date.now(), { cache: 'no-store', credentials: 'same-origin', redirect: 'manual' });
      if (r.type === 'opaqueredirect' || r.status === 401 || r.status === 403) throw new Error('Vercel session expired. Reload to sign in.');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      d = await r.json();
      if (!d || d.ct || d.error) throw new Error(d && d.error ? String(d.error) : 'Feed not readable');
    } catch (err) { error = err.message; d = null; }
    paintMw4(d);
    if (window.MW4Glass) MW4Glass.show('care', d, Object.assign({ error: error }, opts));
  }
  load(true);
  setInterval(() => load(false), 20000);
  window.addEventListener('hudmode', () => load(true));
})();
</script>
</body>
</html>
